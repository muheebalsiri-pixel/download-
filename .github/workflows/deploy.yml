name: Deploy Telegram Bot to Oracle Cloud

on:
  push:
    branches:
      - main  # أو اسم الفرع الرئيسي لديك مثل master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Oracle Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # الانتقال لمجلد المشروع أو إنشاؤه
            mkdir -p ~/telegram-video-downloader-bot
            cd ~/telegram-video-downloader-bot

            # سحب أحدث كود من GitHub
            if [ -d ".git" ]; then
              git pull origin main
            else
              git clone https://github.com/${{ github.repository }}.git .
            fi

            # إنشاء ملف .env تلقائيًا من أسرار GitHub دون رفعه للمستودع
            echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}" > .env
            echo "MAX_FILE_SIZE_MB=49" >> .env
            echo "MAX_CONCURRENT_DOWNLOADS=2" >> .env
            echo "DOWNLOAD_TIMEOUT=300" >> .env
            chmod 600 .env

            # إعادة تشغيل البوت عبر Docker
            docker compose up -d --build
